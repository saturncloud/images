name: saturn
channels:
    - nodefaults
    - conda-forge
dependencies:
    - certifi>=2026.10.19  # CVE-2026-111943: drops the emSign ECC Root CA - G3
    - ca-certificates>=2026.10.18  # CVE-2026-111943: the env's own OpenSSL bundle (ssl/cacert.pem), used by Python's default ssl context
    - python=3.12
    - pip>=26.2.2  # CVE-2026-111943: pip vendors its own certifi; 26.2.2 vendors 2026.10.19
    - ipykernel