name: saturn
channels:
    - conda-forge
    - nodefaults
dependencies:
    - certifi>=2026.10.19  # CVE-2026-111943: drops the emSign ECC Root CA - G3
    - ca-certificates>=2026.10.18  # CVE-2026-111943: the env's own OpenSSL bundle (ssl/cacert.pem), used by Python's default ssl context
    - python=3.13
    - blas=*=mkl
    - bokeh
    - dask
    - fastai
    # These build strings are what make this a GPU image. fastai depends on conda's
    # pytorch, and with no pin the solve takes the newest pytorch even when only its
    # CPU build can be solved. That happened with 2.14.1: on this base's CUDA 12.9,
    # the CUDA set for 2.14.1 needs cuDNN 9.27 builds that require CUDA 13. With the
    # pins, the build fails instead of silently going back to CPU.
    - pytorch=*=cuda129*
    - torchaudio=*=cuda129*
    - torchvision=*=cuda129*
    - fsspec
    - ipykernel
    - ipywidgets
    - matplotlib
    - numpy
    - pandas
    - pillow
    - pip>=26.2.2  # CVE-2026-111943: pip vendors its own certifi; 26.2.2 vendors 2026.10.19
    - py-opencv
    - pyarrow
    - python-graphviz
    - s3fs
    - setuptools
    - tensorboard
    - pynvml
    - pip:
          - dask-saturn
          - saturn-client
          - saturnfs
          - snowflake-connector-python>=5.1.0  # CVE-2026-111943: 5.0.0 compiles in a root list with the emSign ECC Root CA - G3
