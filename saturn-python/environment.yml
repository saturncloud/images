name: saturn
channels:
    - nodefaults
    - conda-forge
dependencies:
    - certifi>=2026.10.19  # CVE-2026-111943: drops the emSign ECC Root CA - G3
    - blas=*=mkl
    - bokeh
    - dask-ml
    - dask
    - ipykernel
    - ipywidgets
    - matplotlib
    - numpy
    - pandas
    - pip
    - pyarrow
    - python=3.13
    - python-graphviz
    - s3fs
    - scikit-learn
    - scipy
    - setuptools
    - voila
    - xgboost
    - pip:
          - dask-saturn
          - snowflake-connector-python
          - saturn-client
          - saturnfs
